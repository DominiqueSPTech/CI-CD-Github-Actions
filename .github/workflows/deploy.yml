# Deploy — atualiza a aplicação na VM via SSH
#
# Fluxo (disparo manual em Actions → deploy → Run workflow):
#   copia deploy/docker-compose.yml para a VM ──► docker compose pull + up -d
#
# Rode depois que as imagens novas estiverem no Docker Hub
# (workflows "backend" e "frontend").
#
# Configure em Settings → Secrets and variables → Actions:
#   Variables: SSH_HOST            Elastic IP da VM (ou o hostname do No-IP)
#              SSH_USER            ubuntu
#              DOCKERHUB_USERNAME  (já cadastrada na parte de CI)
#              DOMAIN              Elastic IP; depois do No-IP, o hostname
#              ACME_EMAIL          seu e-mail (capítulo de HTTPS)
#   Secrets:   SSH_PRIVATE_KEY     conteúdo da chave .pem criada junto com a VM
# =============================================================================
