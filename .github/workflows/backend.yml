# =============================================================================
# Backend — CI + build/push da imagem no Docker Hub
#
# Fluxo (disparo manual em Actions → backend → Run workflow):
#   job "ci" (lint, testes, build) ──► job "docker" (build + push da imagem)
#
# Configure em Settings → Secrets and variables → Actions:
#   Variables: DOCKERHUB_USERNAME
#   Secrets:   DOCKERHUB_TOKEN   (access token do Docker Hub, nunca a senha)
#
# Obs.: DB_PATH, PORT e CORS_ORIGIN são variáveis de RUNTIME (docker run -e).
#       Elas NÃO entram aqui; serão usadas no passo de CD.
# =============================================================================
name: backend

on:
  # Disparo manual pela aba Actions (botão "Run workflow").
  # Atenção: o botão só aparece depois que este arquivo estiver na branch padrão.
  workflow_dispatch:

  # Evolução (depois): disparar automaticamente em PR e em push na main,
  # só quando algo do backend mudar. Descomente e remova o workflow_dispatch se quiser.
  #
  # pull_request:
  #   branches: [main]
  #   paths: ["backend/**", ".github/workflows/backend.yml"]
  # push:
  #   branches: [main]
  #   paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  # ---------------------------------------------------------------------------
  # CI: valida o código.
  # ---------------------------------------------------------------------------
  ci:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: gera e publica a imagem. Só roda se o CI passar.
  # ---------------------------------------------------------------------------
  docker:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    # Só começa depois que o job "ci" terminar com sucesso.
    needs: ci
    # Se ativar o gatilho de pull_request, adicione aqui:
    #   if: github.event_name != 'pull_request'
    # para não publicar imagem a partir de PR.

    steps:
      - name: Normalizar usuário do Docker Hub
        id: dockerhub_user
        shell: bash
        run: |
          username="$(printf '%s' '${{ vars.DOCKERHUB_USERNAME }}' | tr -d '\r\n')"
          echo "value=$username" >> "$GITHUB_OUTPUT"

      # Dica: docker/login-action@v4
      #   username: ${{ vars.DOCKERHUB_USERNAME }}
      #   password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.dockerhub_user.outputs.value }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Dica: docker/build-push-action@v7
      #   Não precisa de checkout: a action usa o "Git context" e o próprio
      #   BuildKit baixa o repositório. Para buildar só a pasta backend:
      #   context: "{{defaultContext}}:backend"
      #   push: true
      #   tags: ${{ vars.DOCKERHUB_USERNAME }}/gastos-backend:latest
      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:backend"
          push: true
          tags: |
            ${{ steps.dockerhub_user.outputs.value }}/gastos-backend:latest
            ${{ steps.dockerhub_user.outputs.value }}/gastos-backend:sha-${{ github.sha }}
