        run: echo "TODO - npm ci"

      - name: Lint
        run: echo "TODO - npm run lint"

      - name: Testes
        run: echo "TODO - npm test"

      - name: Build
        run: echo "TODO - npm run build"

  # ---------------------------------------------------------------------------
  # Docker: gera e publica a imagem. Só roda se o CI passar.
